[package]
name = "rjsonparser"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "Push-based JSON parser and writer (jsonparser-style)"
readme = "README.md"
license = "LGPL-3.0-or-later"
repository = "https://github.com/cpkb-bluezoo/rjsonparser"
keywords = ["json", "parser", "streaming", "serialization"]
categories = ["encoding", "parser-implementations"]

[lib]
name = "rjsonparser"
path = "src/lib.rs"

[[test]]
name = "json_test_suite"
path = "tests/json_test_suite.rs"
harness = false

[dev-dependencies]
